version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # Applies once Dependabot security updates are on in the repo settings.
      security:
        applies-to: security-updates
        patterns: ["*"]
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
    # Major versions stay ungrouped: one PR per package, reviewed by hand.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  # The Dockerfile's base image.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
